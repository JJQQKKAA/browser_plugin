<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Reader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">
  <div class="popup-container">
    <div class="popup-header">
      <div class="header-left">
        <span class="brand-mark">W</span><h1>Web Reader</h1>
        <div id="headerLoading" class="header-loading hidden">
          <div class="spinner-small"></div>
          <span id="loadingText"></span>
        </div>
      </div>
      <div class="header-actions">
        <button id="toggleConfigBtn" class="icon-btn" title="展开/收起阅读任务" aria-controls="readingControls" aria-expanded="false">
          <svg id="toggleConfigIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <button id="openInWindow" class="icon-btn" title="在新窗口打开">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
        <a href="#" id="openOptions" class="icon-link" title="打开配置">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"></path>
          </svg>
        </a>
      </div>
    </div>

    <div id="noConfig" class="message-box hidden">
      <span class="eyebrow">开始阅读</span><h2>让每一篇文章更易读</h2><p>连接你的 AI 模型，获取摘要、解读或翻译。</p>
      <button id="gotoConfig" class="btn btn-primary">前往配置</button>
    </div>

    <div id="mainContent">
      <div id="readingControls" class="reading-controls">
      <div class="page-info">
        <span class="eyebrow">当前阅读</span><span id="pageTitle" class="page-title">正在获取页面…</span><span id="pageSource" class="page-source"></span>
      </div>

      <button id="configSummary" class="config-summary" title="切换模型和任务"></button>
      <div id="configPanel" class="config-panel collapsed">
        <div class="combo-selector">
          <label for="modelSelect">使用模型</label><select id="modelSelect">
            <option value="">选择模型...</option>
          </select>
        </div>
        <div class="combo-selector">
          <label for="promptSelect">阅读任务</label><select id="promptSelect">
            <option value="">选择任务...</option>
          </select>
        </div>
      </div>

      <section class="reading-tools">
        <div class="section-caption"><span>阅读任务</span><a href="#" id="manageTasks">管理任务 ↗</a></div>
        <div id="taskButtons" class="task-buttons"></div>
        <button id="summarizeBtn" class="btn custom-task-btn">运行所选任务</button>
      </section>
      </div>
      <button id="readingContext" class="reading-context" title="展开阅读任务"></button>
      <div id="emptyState" class="reading-empty"><div class="empty-glyph">≋</div><h2>读得更轻松，理解得更深入</h2><p>选择一个阅读任务，即刻开始。<br>也可以先在网页中选中文字。</p></div>

      <div id="result" class="result-box hidden">
        <div class="result-header">
          <h3 id="resultTitle" class="hidden">阅读笔记</h3>
          <div class="generation-bar"><span id="generationStatus" role="status">准备就绪</span><div><button id="retryBtn" class="btn btn-small hidden">重新生成</button><button id="stopBtn" class="btn btn-small hidden">停止生成</button></div></div>
          <div class="result-actions">
            <button id="increaseFontBtn" class="btn btn-small font-btn" title="增大字体">A+</button>
            <button id="decreaseFontBtn" class="btn btn-small font-btn" title="减小字体">A-</button>
            <button id="clearChatBtn" class="btn btn-small" title="清空对话">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
            <button id="copyBtn" class="btn btn-small" title="复制">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
            </button>
          </div>
        </div>
        <div id="chatMessages" class="chat-messages" aria-label="阅读结果与对话"></div><button id="latestBtn" class="latest-btn hidden">回到最新 ↓</button>
        <div id="resultContent" class="result-content hidden"></div>
        <div class="chat-input-area">
          <textarea id="chatInput" rows="2" placeholder="继续提问，深入理解这篇内容…" aria-label="继续提问"></textarea>
          <button id="sendBtn" class="btn btn-primary btn-small">发送</button>
        </div>
      </div>



      <div id="error" class="error-box hidden"></div>
    </div>
  </div>

  <script src="marked.min.js"></script>
  <script src="reader-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
